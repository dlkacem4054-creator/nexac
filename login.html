<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXAC - Secure Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(59, 130, 246, 0.3); padding: 40px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        h2 { color: #60a5fa; margin-bottom: 20px; font-size: 22px; }
        input { width: 100%; padding: 12px; background: #111827; border: 1px solid #374151; color: white; border-radius: 8px; margin-bottom: 15px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .error { color: #ef4444; font-size: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Portal</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username (admin)" required>
            <input type="password" name="password" placeholder="Password (Admin@12345)" required>
            <button type="submit">Secure Login</button>
        </form>
    </div>
</body>
</html>
