<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXAC - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(59, 130, 246, 0.2); padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { color: #60a5fa; font-size: 24px; }
        .logout-btn { background: #ef4444; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; }
        
        .top-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 20px; flex-wrap: wrap; }
        .stat-card { background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(59, 130, 246, 0.2); padding: 20px; border-radius: 12px; flex: 1; min-width: 200px; }
        .stat-card h3 { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
        .stat-card p { font-size: 22px; font-weight: bold; color: #10b981; }
        
        .actions-box { display: flex; gap: 15px; align-items: center; }
        .search-box { background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(59, 130, 246, 0.2); padding: 15px; border-radius: 12px; width: 300px; }
        .search-box input { width: 100%; background: #111827; border: 1px solid #374151; color: white; padding: 10px; border-radius: 6px; outline: none; }
        
        .btn-clear { background: #dc2626; color: white; border: none; padding: 15px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 13px; height: 100%; }
        .btn-clear:hover { background: #b91c1c; }

        .table-container { background: rgba(17, 24, 39, 0.7); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { background: rgba(37, 99, 235, 0.1); color: #60a5fa; font-size: 13px; }
        td { font-size: 14px; color: #d1d5db; }
        .badge-status { background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 4px 8px; border-radius: 4px; font-size: 11px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .btn-view { background: #2563eb; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-view:hover { background: #1d4ed8; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .modal-content { background: #111827; border: 1px solid #3b82f6; width: 600px; max-height: 80vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px 20px; background: #1f2937; display: flex; justify-content: space-between; align-items: center; color: #60a5fa; font-weight: bold; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #9ca3af; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="header">
        <h1>NEXAC ADMIN DASHBOARD</h1>
        <a href="/logout" class="logout-btn">Logout</a>
    </div>

    <div class="top-controls">
        <div class="stat-card">
            <h3>TOTAL REPORTS RECEIVED</h3>
            <p id="total-reports">0</p>
        </div>
        <div class="actions-box">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by Username or HWID..." onkeyup="filterReports()">
            </div>
            <button class="btn-clear" onclick="clearAllReports()">Clear All Reports</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>USERNAME</th>
                    <th>HWID</th>
                    <th>STATUS</th>
                    <th>FILES SCANNED</th>
                    <th>TIME RECEIVED</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="reports-table-body">
                <tr><td colspan="6" style="text-align:center; padding: 30px; color: #6b7280;">Loading reports...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="filesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Scanned Files List</span>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalFilesBody" class="modal-body"></div>
        </div>
    </div>

    <script>
        let globalReports = [];

        function fetchReports() {
            fetch('/api/get-reports')
                .then(response => {
                    if (response.status === 401) { window.location.href = '/login'; return; }
                    return response.json();
                })
                .then(data => {
                    if (!data) return;
                    globalReports = data;
                    document.getElementById('total-reports').textContent = data.length;
                    renderTable(data);
                });
        }

        function renderTable(reports) {
            const tbody = document.getElementById('reports-table-body');
            if (reports.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 30px; color: #6b7280;">No reports found.</td></tr>`;
                return;
            }

            let rowsHtml = '';
            reports.forEach((report) => {
                const originalIndex = globalReports.indexOf(report);
                rowsHtml += `
                    <tr>
                        <td style="font-weight: bold; color: #10b981;">${report.username || 'N/A'}</td>
                        <td style="font-family: monospace; color: #60a5fa;">${report.hwid || 'N/A'}</td>
                        <td><span class="badge-status">${report.status || 'COMPLETED'}</span></td>
                        <td>${report.files ? report.files.length : 0} Files</td>
                        <td style="color: #9ca3af; font-size: 13px;">${report.time || 'N/A'}</td>
                        <td><button class="btn-view" onclick="viewDetails(${originalIndex})">View Details</button></td>
                    </tr>
                `;
            });
            tbody.innerHTML = rowsHtml;
        }

        function filterReports() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = globalReports.filter(report => 
                (report.username && report.username.toLowerCase().includes(query)) ||
                (report.hwid && report.hwid.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        function clearAllReports() {
            if (confirm('Are you sure you want to delete all reports?')) {
                fetch('/api/clear-reports', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            fetchReports();
                        }
                    });
            }
        }

        function viewDetails(index) {
            const report = globalReports[index];
            const modalBody = document.getElementById('modalFilesBody');
            if (report && report.files) {
                modalBody.innerHTML = report.files.map(f => `<div>${f}</div>`).join('');
            } else {
                modalBody.innerHTML = '<div>No files recorded.</div>';
            }
            document.getElementById('filesModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('filesModal').style.display = 'none';
        }

        fetchReports();
        setInterval(fetchReports, 3000);
    </script>
</body>
</html>
